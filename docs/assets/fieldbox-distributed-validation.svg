<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">DroneOS Field Box — Distributed Validation</title>
  <desc id="desc">Operator connects over LAN to DroneOS running on NVIDIA Jetson Orin Nano. DroneOS communicates with PX4 SITL and Gazebo on a separate computer and receives live telemetry back.</desc>

  <rect width="900" height="900" fill="#f6f8fb"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="66" font-size="32" font-weight="700" fill="#0b1f3a">DroneOS Field Box — Distributed Validation</text>
    <text x="60" y="100" font-size="18" fill="#52606d">Validated in Lab/SITL · September 2026</text>

    <rect x="180" y="145" width="540" height="120" rx="16" fill="#dbe8f3" stroke="#0b1f3a" stroke-width="2"/>
    <text x="450" y="188" text-anchor="middle" font-size="24" font-weight="700" fill="#0b1f3a">Operator / Mission Control</text>
    <text x="450" y="222" text-anchor="middle" font-size="18" fill="#334e68">Browser · HTTP · WebSocket</text>

    <line x1="450" y1="265" x2="450" y2="325" stroke="#2675a8" stroke-width="6"/>
    <polygon points="438,315 450,338 462,315" fill="#2675a8"/>
    <text x="475" y="304" font-size="16" fill="#2675a8">LAN</text>

    <rect x="145" y="335" width="610" height="190" rx="18" fill="#0b1f3a"/>
    <text x="450" y="382" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">NVIDIA Jetson Orin Nano</text>
    <text x="450" y="417" text-anchor="middle" font-size="22" fill="#d9ecff">DroneOS Field Box</text>
    <text x="450" y="455" text-anchor="middle" font-size="17" fill="#d9ecff">ARM64 · Docker · non-root · Auth</text>
    <text x="450" y="486" text-anchor="middle" font-size="17" fill="#d9ecff">API · WebSocket · PX4Bridge · telemetry · workflow</text>

    <line x1="410" y1="525" x2="410" y2="595" stroke="#2675a8" stroke-width="6"/>
    <polygon points="398,585 410,608 422,585" fill="#2675a8"/>
    <text x="210" y="568" font-size="16" fill="#2675a8">MAVLink mission upload / start</text>

    <line x1="490" y1="595" x2="490" y2="525" stroke="#4aa2c8" stroke-width="6"/>
    <polygon points="478,537 490,514 502,537" fill="#4aa2c8"/>
    <text x="520" y="568" font-size="16" fill="#318bbd">live telemetry return</text>

    <rect x="180" y="610" width="540" height="125" rx="16" fill="#dbe8f3" stroke="#0b1f3a" stroke-width="2"/>
    <text x="450" y="655" text-anchor="middle" font-size="24" font-weight="700" fill="#0b1f3a">PX4 SITL + Gazebo</text>
    <text x="450" y="689" text-anchor="middle" font-size="18" fill="#334e68">Separate computer</text>
    <text x="450" y="719" text-anchor="middle" font-size="16" fill="#52606d">AUTO mission execution</text>

    <rect x="90" y="785" width="720" height="78" rx="14" fill="#ffffff" stroke="#b7c9d6" stroke-width="2"/>
    <text x="115" y="816" font-size="18" font-weight="700" fill="#0b1f3a">Validated evidence</text>
    <text x="115" y="845" font-size="15" fill="#334e68">ARM64 runtime · authenticated LAN access · remote PX4 mission execution · live telemetry return</text>
  </g>
</svg>